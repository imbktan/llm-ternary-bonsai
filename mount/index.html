<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voxel Pagoda Garden</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a1e2e; }
  canvas { display: block; }
  #hud { position: fixed; top: 14px; left: 16px; font: 12px/1.6 ui-system, system-ui, sans-serif;
         color: rgba(255, 214, 190, 0.9); pointer-events: none; user-select: none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="hud">Voxel Pagoda Garden<br><span style="opacity:.55">drag to orbit &middot; scroll to zoom &middot; camera auto-rotates</span></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------- renderer / scene / camera ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.exposure = 1.35;
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2f2030);
scene.fog = new THREE.FogExp2(0x4a2c42, 0.0055);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);
camera.position.set(13, 10, 16);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.5, 1);
controls.autoRotate = true;
controls.autoRotateSpeed = -0.5;
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 9;
controls.maxDistance = 42;
controls.maxPolarAngle = 1.05;
controls.update();

/* ---------------- warm sunset lighting ---------------- */
const sun = new THREE.DirectionalLight(0xffa059, 3.1);
sun.position.set(18, 6.5, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -13; sun.shadow.camera.right = 14;
sun.shadow.camera.top = 14;   sun.shadow.camera.bottom = -12;
sun.shadow.camera.near = 1;   sun.shadow.camera.far = 70;
sun.shadow.bias = -0.001;
sun.shadow.normalBias = 0.03;
scene.add(sun);

scene.add(new THREE.HemisphereLight(0xb0809f, 0x5a4034, 0.85));
scene.add(new THREE.AmbientLight(0x4a3a55, 0.3));

/* ---------------- standard materials only ---------------- */
const M = {
  grassA: new THREE.MeshStandardMaterial({ color: 0x6a9d4d, flatShading: true }),
  grassB: new THREE.MeshStandardMaterial({ color: 0x84b95c, flatShading: true }),
  dirt:   new THREE.MeshStandardMaterial({ color: 0x7a5a36, flatShading: true }),
  water:  new THREE.MeshStandardMaterial({ color: 0x3a6f96, metalness: 0.6, roughness: 0.1, flatShading: true }),
  wood:   new THREE.MeshStandardMaterial({ color: 0x9c6b3c, flatShading: true }),
  woodDk: new THREE.MeshStandardMaterial({ color: 0x6b4322, flatShading: true }),
  red:    new THREE.MeshStandardMaterial({ color: 0xc03b31, flatShading: true }),
  roof:   new THREE.MeshStandardMaterial({ color: 0x2c2745, flatShading: true }),
  white:  new THREE.MeshStandardMaterial({ color: 0xf5eed8, flatShading: true }),
  stone:  new THREE.MeshStandardMaterial({ color: 0x9a948b, flatShading: true }),
  stoneL: new THREE.MeshStandardMaterial({ color: 0xc1b89f, flatShading: true }),
  bark:   new THREE.MeshStandardMaterial({ color: 0x634230, flatShading: true }),
  leaf:   new THREE.MeshStandardMaterial({ color: 0xea9fc4, flatShading: true }),
  leaf2:  new THREE.MeshStandardMaterial({ color: 0xf8c3dc, flatShading: true }),
  lamp:   new THREE.MeshStandardMaterial({ color: 0xfff1d8, emissive: 0xffa040, emissiveIntensity: 1.0, flatShading: true }),
  gold:   new THREE.MeshStandardMaterial({ color: 0xd9a53b, metalness: 0.8, roughness: 0.3 }),
};
const petalMat = new THREE.MeshBasicMaterial({ color: 0xffcfe0 });

/* ---------------- voxel helper (everything is a box) ---------------- */
const BOX = new THREE.BoxGeometry(1, 1, 1);
function B(x, y, z, sx, sy, sz, mat, cast = true, receive = true) {
  const m = new THREE.Mesh(BOX, mat);
  m.position.set(x, y + sy * 0.5, z);   // y = bottom of the block
  m.scale.set(sx, sy, sz);
  m.castShadow = cast;
  m.receiveShadow = receive;
  scene.add(m);
  return m;
}
const inPond = (x, z) => x >= -6 && x <= -4 && z >= 0 && z <= 3;

/* ---------------- grass island ---------------- */
for (let x = -7; x <= 6; x++)
  for (let z = -7; z <= 6; z++)
    B(x, 0, z, 1, 1, 1, M.dirt);
for (let x = -7; x <= 6; x++)
  for (let z = -7; z <= 6; z++)
    if (!inPond(x, z)) B(x, 1, z, 1, 1, 1, ((x + z) & 1) ? M.grassA : M.grassB);
B(-5, 1, 1.5, 3, 1, 4, M.water);      // pond, flush with the grass

/* ---------------- wooden bridge ---------------- */
B(-5, 2, 1.5, 3, 0.4, 1.2, M.wood);
B(-5, 2.4, 0.9, 3, 0.45, 0.12, M.woodDk);
B(-5, 2.4, 2.1, 3, 0.45, 0.12, M.woodDk);

/* ---------------- 5-tier pagoda ---------------- */
const px = 0.5, pz = 1.5;
B(px, 2, pz, 7, 1, 7, M.stoneL);                       // platform
// tier 1
[[ -2, -2], [ -2, 2], [2, -2], [2, 2]].forEach(([x, z]) => B(px + x, 3, pz + z, 1, 1.8, 1, M.red));
B(px, 3, pz, 3, 1.8, 3, M.white);
B(px, 3, pz + 1.51, 1.4, 1.5, 0.12, M.red);            // door
B(px, 4.8, pz, 6, 0.9, 6, M.roof);
// tier 2
[[ -1.3, -1.3], [ -1.3, 1.3], [1.3, -1.3], [1.3, 1.3]].forEach(([x, z]) => B(px + x, 5.7, pz + z, 1, 1.6, 1, M.red));
B(px, 5.7, pz, 1.8, 1.6, 1.8, M.white);
B(px, 7.3, pz, 4.6, 0.8, 4.6, M.roof);
// tier 3
[[ -0.7, -0.7], [ -0.7, 0.7], [0.7, -0.7], [0.7, 0.7]].forEach(([x, z]) => B(px + x, 8.1, pz + z, 1, 1.4, 1, M.red));
B(px, 8.1, pz, 1.2, 1.4, 1.2, M.white);
B(px, 9.5, pz, 3.4, 0.75, 3.4, M.roof);
// tier 4
[[ -0.3, -0.3], [ -0.3, 0.3], [0.3, -0.3], [0.3, 0.3]].forEach(([x, z]) => B(px + x, 10.25, pz + z, 1, 1.2, 1, M.red));
B(px, 10.25, pz, 0.8, 1.2, 0.8, M.white);
B(px, 11.45, pz, 2.4, 0.6, 2.4, M.roof);
// finial
B(px, 12.05, pz, 0.9, 0.7, 0.9, M.roof);
B(px, 12.75, pz, 0.5, 0.5, 0.5, M.gold);

/* ---------------- red torii + stone step ---------------- */
B(-0.5, 2, 7.2, 1, 3.6, 1, M.red);
B(1.5, 2, 7.2, 1, 3.6, 1, M.red);
B(0.5, 5.4, 7.2, 3, 0.6, 1, M.red);
B(0.5, 6, 7.2, 4.2, 0.7, 1, M.red);
B(0.5, 2, 6.6, 1.4, 0.3, 1.2, M.stoneL);

/* ---------------- cherry trees ---------------- */
function tree(x, z) {
  B(x, 2, z, 0.9, 2.6, 0.9, M.bark);
  B(x, 4.2, z, 3.4, 1.6, 3.4, M.leaf);
  B(x, 4.9, z, 3, 3, 3, M.leaf);
  B(x + 1.6, 5.6, z + 0.9, 1.6, 1.6, 1.6, M.leaf2);
  B(x - 1.4, 5.9, z - 0.8, 1.4, 1.4, 1.4, M.leaf2);
  B(x + 0.4, 6.5, z - 1.2, 1.3, 1.3, 1.3, M.leaf2);
}
tree(5.5, -5.5);
tree(5.5, 4);
tree(-1.5, -5.5);

/* ---------------- stone lanterns ---------------- */
function lantern(x, z) {
  B(x, 2, z, 1.6, 0.5, 1.6, M.stone);
  B(x, 2.5, z, 0.8, 1.2, 0.8, M.stone);
  B(x, 3.7, z, 1.5, 0.4, 1.5, M.stone);
  B(x, 4.1, z, 1, 0.7, 1, M.lamp);
  B(x, 4.8, z, 1.4, 0.4, 1.4, M.stone);
  B(x, 5.2, z, 0.5, 0.5, 0.5, M.stone);
  const L = new THREE.PointLight(0xffc077, 1.3, 9);
  L.position.set(x, 4.4, z);
  scene.add(L);
}
lantern(5, -3);
lantern(-5.5, 5.5);

/* ---------------- stepping stones ---------------- */
B(3.5, 2, -4, 1, 0.15, 1, M.stoneL);
B(1.5, 2, -5.5, 1, 0.15, 1, M.stoneL);

/* ---------------- falling cherry petals ---------------- */
const petalGeo = new THREE.BoxGeometry(0.18, 0.03, 0.12);
const petals = [];
function resetPetals(p, first) {
  const m = p.mesh;
  m.position.set(Math.random() * 13 - 6.5, first ? Math.random() * 12 + 4 : Math.random() * 3 + 15, Math.random() * 13 - 6.5);
  m.rotation.set(Math.random() * Math.PI * 2, Math.random() * Math.PI * 2, Math.random() * Math.PI * 2);
  p.vy  = -0.35 - Math.random() * 0.6;
  p.sx  = 0.25 + Math.random() * 0.9;
  p.sz  = 0.25 + Math.random() * 0.9;
  p.sy  = (Math.random() * 2 - 1) * 0.07;
  p.ph  = Math.random() * Math.PI * 2;
}
for (let i = 0; i < 130; i++) {
  const m = new THREE.Mesh(petalGeo, petalMat);
  const p = { mesh: m };
  scene.add(m);
  petals.push(p);
}
petals.forEach(p => resetPetals(p, true));

/* ---------------- loop ---------------- */
const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  for (const p of petals) {
    const m = p.mesh;
    m.position.y += p.vy * dt;
    m.position.x += Math.sin(t * p.sx + p.ph) * dt * 0.8;
    m.position.z += Math.cos(t * p.sz + p.ph * 1.7) * dt * 0.8;
    m.rotation.y += p.sy * dt;
    m.rotation.z += 0.15 * dt;
    if (m.position.y < 1.9) resetPetals(p, false);
  }
  controls.update();
  renderer.render(scene, camera);
}
loop();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
